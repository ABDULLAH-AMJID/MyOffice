# R8 over the bundled OCR engine needs headroom; 820m gets OOM-killed on low-memory builders.
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=448m -XX:ActiveProcessorCount=2 -Djava.io.tmpdir=/var/tmp/tmp -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 full mode blows past 2 GB on the smallest builders; the APK is the same size either way.
android.enableR8.fullMode=false
